# Gateway nginx = a "camada intermediária" do REST [R8].
# O cliente NÃO sabe que a API existe: só conhece este endereço.
# O gateway também faz CACHE das respostas que a API marca como cacheáveis [R7].

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=loja:10m max_size=50m inactive=60s;

server {
    listen 80;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # --- cache ---
        proxy_cache loja;
        # A chave inclui o Accept: JSON e XML são representações diferentes do mesmo recurso.
        proxy_cache_key "$request_uri|$http_accept";
        # O cliente pode forçar revalidação com "Cache-Control: no-cache".
        proxy_cache_bypass $http_cache_control;

        # Cabeçalhos que tornam o gateway "visível" na demo:
        add_header X-Gateway "nginx" always;
        add_header X-Cache-Status $upstream_cache_status always;   # MISS | HIT | BYPASS
    }
}
